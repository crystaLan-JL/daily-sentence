<title>每日一句 日语韩语</title>

<style>
/* layout: one narrow column, two sentence blocks; every character carries its reading above/below */
:root{
  --bg:#f3f5f4; --surface:#fbfcfb; --ink:#1c2630; --muted:#66727c; --line:#d5dbd9; --accent:#2f5d8a;
  --display-ja:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --display-ko:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141a1f;--surface:#1b232a;--ink:#e4e9ec;--muted:#93a0a9;--line:#2e3942;--accent:#8ab4dc;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141a1f;--surface:#1b232a;--ink:#e4e9ec;--muted:#93a0a9;--line:#2e3942;--accent:#8ab4dc;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:28px 20px 56px;display:flex;flex-direction:column;gap:28px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.08em}
.date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.4;cursor:default}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px 22px;display:flex;flex-direction:column;gap:16px}
.lang{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.sent{margin:0;display:flex;flex-wrap:wrap;gap:10px 3px;align-items:flex-end}
.tk{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.tk b{font-weight:600;font-size:25px}
.tk .k,.tk .ro{font-style:normal;font-family:var(--body);font-size:11px;color:var(--muted);min-height:14px;white-space:nowrap}
.tk .ro{color:var(--accent)}
.ja .tk b{font-family:var(--display-ja)} .ko .tk b{font-family:var(--display-ko)}
.sm{gap:6px 2px}
.sm .tk b{font-size:17px}
.gap{width:10px}
.pitch{display:inline-flex;align-items:flex-end;margin-left:12px;font-size:13px;color:var(--muted);white-space:nowrap}
.pitch i{font-style:normal;padding:2px 1px 0;border-top:2px solid transparent;border-right:2px solid transparent}
.pitch i.hi{border-top-color:var(--accent);color:var(--ink)}
.pitch i.drop{border-right-color:var(--accent)}
.pitch sup{margin-left:4px;font-size:11px;color:var(--accent)}
.words dt{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted)}
.zh{margin:0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0}
h2{font-size:13px;color:var(--muted);font-weight:600;margin:6px 0 0;letter-spacing:.06em}
.words{display:grid;grid-template-columns:auto 1fr;gap:12px 20px;font-size:15px;align-items:center;margin:0}
.words dt{margin:0} .words dd{margin:0}
.gram{display:flex;flex-direction:column;gap:16px;font-size:15px}
.gram .item{display:flex;flex-direction:column;gap:4px}
.gram p{margin:0}
.kr{font-style:normal;color:var(--accent);font-size:13px}
rt{font-size:.6em;color:var(--muted)}
footer{display:flex;flex-direction:column;gap:12px;color:var(--muted);font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.done{border-color:var(--accent);color:var(--accent)}
@media (max-width:420px){.tk b{font-size:21px}.sm .tk b{font-size:16px}.words{grid-template-columns:1fr;gap:4px}.words dd{margin-bottom:10px}}
</style>

<main>
<header>
  <h1>每日一句</h1>

<div id="cards" style="display:flex;flex-direction:column;gap:20px"></div>

  <span>注音说明：日语上面是假名，下面是罗马音；助词は读 wa、を读 o。日语单词后面带线的假名是声调（东京标准音）：上面有横线的拍读高，竖线处音高落下，数字是落下的位置，0 表示不落下；数据来自 Kanjium 声调词典。韩语的标准音没有声调，所以不标。韩语的罗马音按实际读音标，前一个字的收音会连到后一个字上，比如 먹었어요 读作 meo-geo-sseo-yo。</span>
</footer>

  <div class="lang">${ko?"한국어":"日本語"}</div>
  <p class="sent" lang="${voice}">${sent}</p>
  <div class="row"><button data-say="${voice}" data-text="${esc(text)}">朗读</button><button data-tr>看中文</button><span class="note" role="status"></span></div>
  <p class="zh" hidden>${esc(e.z)}</p>
  <h2>单词</h2><dl class="words">${w}</dl>
  <h2>语法</h2><div class="gram">${g}</div>
</section>`;
}

/* 朗读：必须挑到对应语言的语音才读，否则直接说明原因，不让别的语音乱读 */
function voices(){
  return new Promise(res=>{
    if(!("speechSynthesis" in window))return res(null);
    const v=speechSynthesis.getVoices(); if(v.length)return res(v);
    let done=false; const fin=()=>{if(!done){done=true;res(speechSynthesis.getVoices())}};
    speechSynthesis.addEventListener("voiceschanged",fin,{once:true}); setTimeout(fin,1200);
  });
}
async function say(btn){
  const note=btn.parentElement.querySelector(".note"), lang=btn.dataset.say, code=lang.slice(0,2), name=code==="ja"?"日语":"韩语";
  note.textContent="";
  const vs=await voices();
  if(vs===null){note.textContent="这个浏览器不支持朗读。";return}
  const fit=vs.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(code));
  if(!fit.length){note.textContent=vs.length?`这台设备没有装${name}语音，所以读不出来。在系统的语音设置里添加${name}后再点。`:"这里拿不到系统语音，朗读用不了。";return}
  const v=fit.find(x=>x.localService)||fit[0];
  try{
    const u=new SpeechSynthesisUtterance(btn.dataset.text);
    u.voice=v; u.lang=v.lang; u.rate=.85;
    u.onerror=()=>{note.textContent="朗读被浏览器拦下了。"};
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){note.textContent="朗读被浏览器拦下了。"}
}

const DAY=86400000, WD="日一二三四五六";
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const dayNo=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY);
const key=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
let offset=0;
function load(){try{return JSON.parse(localStorage.getItem("ikku-done")||"[]")}catch(e){return window._mem||[]}}
function save(a){window._mem=a;try{localStorage.setItem("ikku-done",JSON.stringify(a))}catch(e){}}
function streak(a){let n=0,d=today();if(!a.includes(key(d)))d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);while(a.includes(key(d))){n++;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1)}return n}
function render(){
  const t=today(), d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+offset), n=dayNo(d);
  document.getElementById("date").textContent=`${d.getMonth()+1}月${d.getDate()}日 周${WD[d.getDay()]}`+(offset===0?" · 今天":"");
  document.getElementById("next").disabled=offset>=0;
  const m=(x,l)=>((x%l)+l)%l;
  document.getElementById("cards").innerHTML=card(JA[m(n,JA.length)],false)+card(KO[m(n,KO.length)],true);
  const a=load(), done=a.includes(key(t)), s=streak(a), b=document.getElementById("mark");
  b.textContent=done?"今天读完了 ✓":"今天读完了"; b.className=done?"done":"";
  document.getElementById("streak").textContent=s?`已经连续 ${s} 天`:"读完今天这两句，点一下右边";
}
document.getElementById("prev").onclick=()=>{offset--;render()};
document.getElementById("next").onclick=()=>{if(offset<0){offset++;render()}};
document.getElementById("mark").onclick=()=>{const a=load(),k=key(today());if(!a.includes(k)){a.push(k);save(a.slice(-400))}render()};
document.getElementById("cards").addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b)return;
  if(b.hasAttribute("data-tr")){const z=b.closest("section").querySelector(".zh");z.hidden=!z.hidden;b.textContent=z.hidden?"看中文":"收起中文"}
  else if(b.dataset.say)say(b);
});
render();
</script>
